[package]
name = "larchscan"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Explainable on-demand file triage and reversible quarantine for Windows"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Antimalware"] }

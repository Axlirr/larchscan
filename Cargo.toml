[package]
name = "larchscan"
version = "0.4.0"
default-run = "larchscan"
edition = "2024"
rust-version = "1.92"
description = "Explainable on-demand file triage, startup inspection, and reversible quarantine for Windows"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
getrandom = "0.4"
hex = "0.4"
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Antimalware",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
] }
tao = { version = "0.35", optional = true }
tray-icon = { version = "0.27", optional = true, default-features = false }
wry = { version = "0.58", optional = true, default-features = false }
rfd = { version = "0.17", optional = true, default-features = false }

[features]
desktop = ["dep:tao", "dep:tray-icon", "dep:wry", "dep:rfd"]

[[bin]]
name = "larchscan-desktop"
path = "src/desktop/main.rs"
required-features = ["desktop"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
